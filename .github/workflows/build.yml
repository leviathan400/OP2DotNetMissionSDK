name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned: the projects target the VS 2022 (v143) toolset.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild DotNetMissionSDK.sln -t:Restore -p:Configuration=Release -p:Platform=x86

      # Same command as README "Build command". The PlatformToolset override is
      # required because the vendored HFL/Outpost2DLL projects target v141/v142.
      - name: Build
        run: msbuild DotNetMissionSDK.sln -p:Configuration=Release -p:Platform=x86 -p:PlatformToolset=v143 -m

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: OP2DotNetMissionSDK-${{ github.sha }}
          if-no-files-found: error
          path: |
            Release/cTest.dll
            Release/DotNetInterop.dll
            DotNetMissionSDK/bin/Release/netstandard2.0/DotNetMissionSDK_v0.dll
            Outpost2/cTest.opm
